[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "applemusic"
version = "0.0.1"
description = "Unofficial Python client for the Apple Music web API, with Playwright-driven authentication."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{ name = "Luna Parker" }]
keywords = ["apple-music", "music", "api", "playwright", "spotipy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "httpx>=0.27",
    "playwright>=1.45",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/LunaParker/apple-music-py"
Issues = "https://github.com/LunaParker/apple-music-py/issues"

[project.scripts]
applemusic = "applemusic.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["applemusic"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
